name: PaperCrane watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new lots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py

      - name: Save what we've seen
        run: |
          git config user.name "papercrane-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen lots"
          git push
